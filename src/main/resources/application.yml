server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: personal-finance-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/financedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        # A browser frontend on a different site (e.g. Vercel) needs SameSite=None
        # (only honored by browsers when Secure is also set, which it is above) to
        # send this cookie on cross-site fetch/XHR requests.
        same-site: none

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

spring:
  config:
    activate:
      on-profile: render
  datasource:
    url: jdbc:h2:file:${H2_DB_PATH:/opt/render/project/src/data/financedb};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:financedb-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
